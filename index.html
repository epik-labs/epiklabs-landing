<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epik Labs — Building the future of software</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050810;
      --surface: #0d1224;
      --border: rgba(99, 132, 255, 0.15);
      --accent: #6384ff;
      --accent-glow: rgba(99, 132, 255, 0.35);
      --text: #e8eaf6;
      --text-muted: #7b82a8;
      --star-color: rgba(255, 255, 255, 0.7);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Stars ─────────────────────────────────────────────── */

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: var(--star-color);
      animation: twinkle var(--dur, 4s) ease-in-out infinite var(--delay, 0s);
    }

    @keyframes twinkle {
      0%, 100% { opacity: var(--min-op, 0.2); }
      50%       { opacity: var(--max-op, 0.9); }
    }

    /* ── Constellation lines ────────────────────────────────── */

    .constellation {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .constellation svg {
      width: 100%;
      height: 100%;
    }

    /* ── Nebula glow blobs ──────────────────────────────────── */

    .nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .nebula-1 {
      width: 500px;
      height: 500px;
      top: -100px;
      right: -100px;
      background: radial-gradient(circle, rgba(99, 132, 255, 0.12) 0%, transparent 70%);
    }

    .nebula-2 {
      width: 400px;
      height: 400px;
      bottom: -80px;
      left: -80px;
      background: radial-gradient(circle, rgba(160, 99, 255, 0.10) 0%, transparent 70%);
    }

    /* ── Main content ───────────────────────────────────────── */

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 680px;
      width: 100%;
      gap: 0;
    }

    /* ── Nav logo ───────────────────────────────────────────── */

    .nav-logo {
      position: fixed;
      top: 1.25rem;
      left: 1.5rem;
      width: auto;
      height: 48px;
      object-fit: contain;
      z-index: 10;
    }

    /* ── Heading ────────────────────────────────────────────── */

    h1 {
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 1.25rem;
      background: linear-gradient(135deg, #ffffff 30%, #a0b4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Tagline ────────────────────────────────────────────── */

    .tagline {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.01em;
      margin-bottom: 2.5rem;
    }

    /* ── Divider ────────────────────────────────────────────── */

    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin-bottom: 2.5rem;
    }

    /* ── Coming soon ────────────────────────────────────────── */

    .coming-soon {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3.5rem;
    }

    /* ── Waitlist card ──────────────────────────────────────── */

    .waitlist-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 2rem 2.25rem;
      position: relative;
      overflow: hidden;
    }

    .waitlist-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
    }

    .waitlist-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .waitlist-card p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    /* ── Form ───────────────────────────────────────────────── */

    .form-row {
      display: flex;
      gap: 0.625rem;
    }

    .form-row input[type="email"] {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 0;
    }

    .form-row input[type="email"]::placeholder {
      color: var(--text-muted);
    }

    .form-row input[type="email"]:focus {
      border-color: rgba(99, 132, 255, 0.5);
      box-shadow: 0 0 0 3px rgba(99, 132, 255, 0.1);
    }

    .form-row button {
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .form-row button:hover {
      background: #7a9aff;
      box-shadow: 0 0 20px rgba(99, 132, 255, 0.4);
    }

    .form-row button:active {
      transform: scale(0.97);
    }

    /* ── Form feedback ──────────────────────────────────────── */

    .form-message {
      margin-top: 0.875rem;
      font-size: 0.8rem;
      font-weight: 500;
      min-height: 1.2em;
      display: none;
    }

    .form-message.success {
      color: #6ee7b7;
      display: block;
    }

    .form-message.error {
      color: #fca5a5;
      display: block;
    }

    .form-row button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── Footer ─────────────────────────────────────────────── */

    footer {
      position: relative;
      z-index: 1;
      margin-top: 3rem;
      padding-bottom: 2rem;
      font-size: 0.75rem;
      color: rgba(123, 130, 168, 0.5);
      letter-spacing: 0.05em;
    }

    /* ── Responsive ─────────────────────────────────────────── */

    @media (max-width: 480px) {
      .form-row {
        flex-direction: column;
      }

      .form-row button {
        width: 100%;
        padding: 0.75rem;
      }

      .waitlist-card {
        padding: 1.5rem 1.25rem 1.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background layers -->
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>

  <div class="stars" aria-hidden="true">
    <div class="star" style="width:1px;height:1px;top:8%;left:14%;--dur:3.2s;--delay:-1s;--min-op:0.15;--max-op:0.8;"></div>
    <div class="star" style="width:2px;height:2px;top:12%;left:72%;--dur:4.1s;--delay:-2.3s;--min-op:0.2;--max-op:1;"></div>

    <div class="star" style="width:1px;height:1px;top:70%;left:58%;--dur:4.3s;--delay:-3.4s;--min-op:0.1;--max-op:0.8;"></div>
    <div class="star" style="width:1px;height:1px;top:82%;left:80%;--dur:3.9s;--delay:-1.2s;--min-op:0.15;--max-op:0.9;"></div>
    <div class="star" style="width:2px;height:2px;top:88%;left:10%;--dur:4.7s;--delay:-0.3s;--min-op:0.2;--max-op:0.95;"></div>
    <div class="star" style="width:1px;height:1px;top:15%;left:55%;--dur:6s;--delay:-2.8s;--min-op:0.1;--max-op:0.65;"></div>
    <div class="star" style="width:1px;height:1px;top:38%;left:37%;--dur:4.4s;--delay:-1.5s;--min-op:0.15;--max-op:0.7;"></div>
    <div class="star" style="width:2px;height:2px;top:54%;left:68%;--dur:3.6s;--delay:-2.6s;--min-op:0.2;--max-op:1;"></div>

    <div class="star" style="width:1px;height:1px;top:93%;left:32%;--dur:4s;--delay:-3.1s;--min-op:0.15;--max-op:0.85;"></div>
    <div class="star" style="width:2px;height:2px;top:2%;left:30%;--dur:5.7s;--delay:-1.9s;--min-op:0.2;--max-op:0.95;"></div>
    <div class="star" style="width:1px;height:1px;top:27%;left:83%;--dur:3.3s;--delay:-0.4s;--min-op:0.1;--max-op:0.8;"></div>
    <div class="star" style="width:1px;height:1px;top:65%;left:3%;--dur:4.9s;--delay:-2.4s;--min-op:0.15;--max-op:0.9;"></div>
    <div class="star" style="width:2px;height:2px;top:42%;left:95%;--dur:3.7s;--delay:-1.1s;--min-op:0.2;--max-op:1;"></div>

    <div class="star" style="width:1px;height:1px;top:57%;left:18%;--dur:4.2s;--delay:-1.6s;--min-op:0.15;--max-op:0.85;"></div>
    <div class="star" style="width:2px;height:2px;top:22%;left:97%;--dur:6.1s;--delay:-0.8s;--min-op:0.2;--max-op:0.95;"></div>
    <div class="star" style="width:1px;height:1px;top:79%;left:74%;--dur:3.4s;--delay:-3.2s;--min-op:0.1;--max-op:0.75;"></div>
    <div class="star" style="width:1px;height:1px;top:49%;left:50%;--dur:4.8s;--delay:-2s;--min-op:0.15;--max-op:0.8;"></div>
    <div class="star" style="width:2px;height:2px;top:85%;left:42%;--dur:5.5s;--delay:-1.3s;--min-op:0.2;--max-op:1;"></div>
  </div>

  <!-- Constellation (decorative SVG lines between a few star positions) -->
  <div class="constellation" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <g stroke="rgba(99,132,255,0.12)" stroke-width="0.08" fill="none">
        <!-- upper-right cluster -->
        <line x1="72" y1="12" x2="88" y2="5"/>
        <line x1="88" y1="5"  x2="97" y2="22"/>
        <line x1="72" y1="12" x2="83" y2="27"/>
        <!-- left-side cluster -->
        <line x1="6"  y1="33" x2="14" y2="8"/>
        <line x1="6"  y1="33" x2="3"  y2="65"/>
        <line x1="3"  y1="65" x2="10" y2="88"/>
        <!-- bottom cluster -->
        <line x1="25" y1="61" x2="46" y2="75"/>
        <line x1="46" y1="75" x2="32" y2="93"/>
        <line x1="46" y1="75" x2="63" y2="96"/>
        <!-- right-side -->
        <line x1="91" y1="47" x2="95" y2="68"/>
        <line x1="58" y1="54" x2="91" y2="47"/>
      </g>
    </svg>
  </div>

  <img src="logo.svg" alt="Epik Labs" class="nav-logo">

  <!-- Main content -->
  <main>
    <h1>EPIK</h1>

    <p class="tagline">Building the future...</p>

    <div class="divider"></div>

    <p class="coming-soon">Coming Soon</p>

    <div class="waitlist-card">
      <h2>Join the Waitlist</h2>
      <p>Be the first to know when we launch.</p>
      <form class="form-row" id="waitlist-form">
        <input
          type="email"
          name="email"
          placeholder="your@email.com"
          required
          autocomplete="email"
        >
        <button type="submit">Notify Me</button>
      </form>
      <p class="form-message" id="form-message" aria-live="polite"></p>
    </div>
  </main>

  <footer>&copy; 2026 Epik Labs</footer>

  <script>
    // Replace with your deployed Worker URL
    const WORKER_URL = 'https://epiklabs-waitlist.epiklabs.workers.dev';

    const form = document.getElementById('waitlist-form');
    const msg = document.getElementById('form-message');
    const btn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();

      btn.disabled = true;
      btn.textContent = 'Submitting…';
      msg.className = 'form-message';
      msg.textContent = '';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          msg.className = 'form-message success';
          msg.textContent = "You're on the list! We'll be in touch.";
          form.reset();
        } else {
          throw new Error(data.error || 'Unexpected error');
        }
      } catch (err) {
        msg.className = 'form-message error';
        msg.textContent = err.message || 'Something went wrong. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Notify Me';
      }
    });
  </script>

</body>
</html>
